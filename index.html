<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖縄特産品 BtoB卸売ポータル【社内用】</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #008080;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { margin: 0; font-size: 24px; }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border: 2px dashed #008080;
            border-radius: 8px;
        }
        h2 { color: #333; margin-top: 0; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="file"] {
            display: block;
            margin-top: 5px;
        }
        .btn-submit {
            background-color: #008080;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 200px;
        }
        .btn-submit:hover { background-color: #005a5a; }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            font-weight: bold;
        }
        .success { background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>

    <header>
        <h1>🌺 沖縄特産品 BtoB卸売ポータル</h1>
        <div>【バイヤー専用ページ】</div>
    </header>

    <div class="container">
        <h2>【社内用】新商品・写真の追加フォーム</h2>
        
        <form id="productForm">
            <div class="form-group">
                <label for="pName">商品名</label>
                <input type="text" id="pName" placeholder="例：沖縄県産完熟マンゴー 4kg" required>
            </div>
            
            <div class="form-group">
                <label for="pPrice">卸価格 (税別)</label>
                <input type="text" id="pPrice" placeholder="例：8000" required>
            </div>
            
            <div class="form-group">
                <label for="pLot">最低ロット (MOQ)</label>
                <input type="text" id="pLot" placeholder="例：5ケースから" required>
            </div>
            
            <div class="form-group">
                <label for="pImage">商品写真</label>
                <input type="file" id="pImage" accept="image/*" required>
            </div>
            
            <button type="submit" class="btn-submit">サイトに商品を登録する</button>
        </form>

        <div id="msg" class="message success">商品を登録しました！お客さんページに反映されます。</div>
    </div>

    <script>
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const lot = document.getElementById('pLot').value;
            const fileInput = document.getElementById('pImage');
            const file = fileInput.files[0];
            
            const reader = new FileReader();
            reader.onloadend = function() {
                const base64Image = reader.result; // 画像をデータ化
                
                // 既存のデータを取得、なければ空の配列
                let products = JSON.parse(localStorage.getItem('okinawa_products')) || [];
                
                // 新しい商品を追加
                products.push({
                    name: name,
                    price: price,
                    lot: lot,
                    image: base64Image
                });
                
                // 保存
                localStorage.setItem('okinawa_products', JSON.stringify(products));
                
                // フォームをリセットしてメッセージ表示
                document.getElementById('productForm').reset();
                const msg = document.getElementById('msg');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 4000);
            }
            
            if (file) {
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
